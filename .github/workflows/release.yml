name: Release binaries

# Runs on every version tag push (e.g. v1.0.0).
# Produces standalone single-file executables for Linux, macOS (arm64), and
# Windows, then attaches them to the GitHub Release.
# macOS Intel (x86_64) is not built separately; the arm64 binary runs on
# Intel Macs under Rosetta 2.
#
# Runtime libusb requirements:
#   macOS  : brew install libusb
#   Linux  : apt install libusb-1.0-0
#   Windows: libusb-1.0.dll is bundled in the .exe; only the WinUSB device
#            driver (Zadig) is needed for USB access to the camera.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    name: Build — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            exe_suffix: ''

          - os: macos-latest      # arm64 (Apple Silicon / M-series)
            label: macos-arm64
            exe_suffix: ''

          - os: windows-latest
            label: windows-x86_64
            exe_suffix: '.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-capture.txt
          pip install pyinstaller

      - name: Download libusb-1.0.dll (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o libusb.7z \
            https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27-binaries.7z
          7z e libusb.7z VS2022/MS64/dll/libusb-1.0.dll -o. -y

      - name: Build seek18hz_unlock
        shell: bash
        run: |
          EXTRA=""
          [ "$RUNNER_OS" = "Windows" ] && EXTRA="--add-binary libusb-1.0.dll;."
          pyinstaller --onefile --clean \
            --name seek18hz_unlock-${{ matrix.label }} \
            $EXTRA seek18hz_unlock.py

      - name: Build measure_fps
        shell: bash
        run: |
          EXTRA=""
          [ "$RUNNER_OS" = "Windows" ] && EXTRA="--add-binary libusb-1.0.dll;."
          pyinstaller --onefile --clean \
            --name measure_fps-${{ matrix.label }} \
            $EXTRA measure_fps.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binaries-${{ matrix.label }}
          path: |
            dist/seek18hz_unlock-${{ matrix.label }}${{ matrix.exe_suffix }}
            dist/measure_fps-${{ matrix.label }}${{ matrix.exe_suffix }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          generate_release_notes: true
          files: dist/**
